name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (tsc strict + vite)
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test — every channel × section, zero console errors
        run: npm run test:smoke

      - name: Upload channel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-screenshots
          path: studio/tests/screenshots/
          if-no-files-found: ignore
