<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The studio is a light-only design (it renders pixel-accurate channel
         mockups). Declare the scheme so browser "auto dark mode" and dark-mode
         extensions don't force-darken it — otherwise the transparent picker
         overlay reads as a grey scrim on devices that have that turned on. -->
    <meta name="color-scheme" content="light" />
    <title>Channel Studio</title>
    <meta name="description" content="Build realistic previews of WhatsApp, RCS, SMS, Email, Push, In-App, Web and Ad messages — one studio, every channel." />
    <meta name="theme-color" content="#635bff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shared screen recorder + review studio (vanilla libs, treated as a library like
         the root tools do). gif-encoder must load before recorder. Loaded as classic
         scripts so window.gifenc / window.ChannelStudioRecorder exist before the app's
         effects run; the app degrades gracefully if they're absent (e.g. artifact CSP). -->
    <script src="/gif-encoder.js"></script>
    <script src="/recorder.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
